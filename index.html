<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GameMaster3D Demo</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07031b;color:#fff;font-family:Arial,sans-serif}
button{cursor:pointer;font:inherit;border:0}
header{height:70px;padding:10px 20px;display:flex;align-items:center;gap:15px;background:#09051d;border-bottom:1px solid #39257d;position:sticky;top:0;z-index:10}
.logo{font-size:28px;font-weight:900;font-style:italic}.logo b{color:#16aaff}
.balance{margin-left:auto;border:1px solid #38247c;border-radius:15px;padding:7px 12px;display:flex;align-items:center;gap:8px}
.coin{background:#ffc928;color:#8b5500;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.balance small{display:block;color:#aaa}.balance strong{font-size:18px}
.plus{background:#20c84d;color:#fff;border-radius:50%;width:35px;height:35px;font-size:23px}
nav{display:flex;gap:18px}nav button{background:none;color:#fff}nav span{display:block;text-align:center;font-size:23px}
.wrap{max-width:1400px;margin:auto;padding:15px 22px 80px}
.heroRow{display:grid;grid-template-columns:1fr 300px;gap:12px}
.hero{min-height:230px;padding:25px;border:1px solid #482b9b;border-radius:16px;background:radial-gradient(circle at 75%,#6314a9,#10052d 65%);position:relative;overflow:hidden}
.hero:after{content:"🎁";position:absolute;right:40px;bottom:10px;font-size:100px;opacity:.65}
.hero h1{font-size:40px;margin:0}.hero h2{color:#ffd51b;font-size:32px;margin:4px 0}
.hero p{font-size:17px;max-width:500px;line-height:1.5}
.daily{padding:24px;border:1px solid #482b9b;border-radius:16px;background:#10072f}
.daily h2{margin-top:0}.daily button{width:100%}
.btn{padding:12px 22px;border-radius:9px;font-weight:bold;margin:5px}.purple{background:#7023ff;color:#fff}.yellow{background:#ffd21a;color:#111}.green{background:#22c94c;color:#fff}
.quick{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:12px 0}
.quick button,.card,.reward{background:#120833;border:1px solid #392581;color:#fff;border-radius:13px}
.quick button{padding:13px 5px;font-weight:bold}.ico{display:block;font-size:30px;margin-bottom:6px}
.section{border:1px solid #392581;border-radius:15px;background:#0e062b;padding:12px;margin:12px 0}
.head{display:flex;justify-content:space-between;align-items:center}.head h2{margin:5px}
.view{background:#29145e;color:#fff;padding:8px 15px;border-radius:18px}
.girls,.games,.rewards{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}
.card,.reward{text-align:center;overflow:hidden}
.girl{height:160px;display:grid;place-items:end center;font-size:70px;background:linear-gradient(#60421d,#180b32)}
.card h3,.reward h3{font-size:15px;margin:8px 4px}.coins{color:#ffd21a;padding:0 5px 10px}
.art{height:105px;display:grid;place-items:center;font-size:55px;background:radial-gradient(circle,#32116f,#0c0628)}
.bottom{position:fixed;bottom:0;left:0;right:0;height:62px;background:#09051f;border-top:1px solid #33206f;display:flex;justify-content:center;gap:60px;z-index:15}
.bottom button{background:none;color:#fff}.bottom span{display:block;font-size:22px}
.modal{display:none;position:fixed;inset:0;background:#000d;z-index:30;align-items:center;justify-content:center;padding:12px}
.modal.open{display:flex}.box{width:min(850px,100%);max-height:92vh;overflow:auto;background:#0d0629;border:1px solid #5a37bb;border-radius:17px;padding:18px}
.close{float:right;background:#2a165c;color:#fff;padding:8px 12px;border-radius:8px}
.game{background:#080a0d;border-radius:15px;padding:10px}.gameTop{display:flex;justify-content:space-between;align-items:center}
.screen{height:300px;border:1px solid #444;border-radius:15px;background:radial-gradient(circle,#123b5b,#05070b 65%);display:grid;place-items:center;position:relative;overflow:hidden}
.mult{font-size:62px;font-weight:bold}.plane{position:absolute;left:15%;bottom:25px;font-size:65px}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.control{background:#17181c;border-radius:12px;padding:13px}.control input{width:100%;padding:11px;margin:7px 0;border-radius:7px;border:0}
.status{text-align:center;color:#bbb;margin:10px}
.wheel{width:200px;height:200px;border-radius:50%;border:12px solid #ffd21a;background:conic-gradient(#7023ff 0 45deg,#ffd21a 45deg 90deg,#19a9ff 90deg 135deg,#e22cff 135deg 180deg,#20d65c 180deg 225deg,#ff542c 225deg 270deg,#8b4fff 270deg 315deg,#ffd21a 315deg);margin:20px auto;transition:transform 2s}
@media(max-width:900px){nav{display:none}.heroRow{grid-template-columns:1fr}.quick{grid-template-columns:repeat(3,1fr)}.girls,.games,.rewards{grid-template-columns:repeat(3,1fr)}.bottom{gap:25px}}
@media(max-width:520px){header{padding:8px}.logo{font-size:21px}.wrap{padding:8px 7px 75px}.balance{min-width:130px}.quick{grid-template-columns:repeat(2,1fr)}.girls,.games,.rewards{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:30px}.hero h2{font-size:25px}.controls{grid-template-columns:1fr}.bottom{gap:17px}.bottom button{font-size:11px}}
</style>
</head>

<body>

<header>
<div class="logo">👑 GameMaster<span>3</span><b>D</b></div>

<div class="balance">
<div class="coin">●</div>
<div><small>Balance</small><strong id="bal">50,000</strong></div>
<button class="plus" onclick="wallet()">+</button>
</div>

<nav>
<button onclick="info('Rewards')"><span>🎁</span>Rewards</button>
<button onclick="info('Messages')"><span>💬</span>Messages</button>
<button onclick="info('Support')"><span>🎧</span>Support</button>
</nav>
</header>

<main class="wrap">

<div class="heroRow">

<section class="hero">
<h1>Play & Win</h1>
<h2>Amazing Rewards</h2>
<p>Play your favorite games and win exciting virtual rewards.</p>
<button class="btn purple" onclick="info('Login')">Login</button>
<button class="btn yellow" onclick="info('Create Account')">Create Account</button>
</section>

<section class="daily">
<h2>🎁 Daily Bonus</h2>
<p>Claim your daily virtual coin bonus.</p>
<button class="btn yellow" onclick="bonus()">Claim Now</button>
</section>

</div>

<div class="quick">
<button onclick="game('Lucky Wheel')"><span class="ico">🎡</span>Spin Wheel</button>
<button onclick="bonus()"><span class="ico">📅</span>Daily Bonus</button>
<button onclick="game('Lucky Card')"><span class="ico">🃏</span>Lucky Card</button>
<button onclick="game('Scratch Win')"><span class="ico">🏅</span>Scratch & Win</button>
<button onclick="info('Invite & Earn')"><span class="ico">👥</span>Invite & Earn</button>
<button onclick="info('VIP Club')"><span class="ico">👑</span>VIP Club</button>
</div>

<section class="section">
<div class="head"><h2>Top Girls</h2><button class="view">View All</button></div>
<div class="girls" id="girls"></div>
</section>

<section class="section">
<div class="head"><h2>Popular Games — 50 Games</h2><button class="view">View All</button></div>
<div class="games" id="games"></div>
</section>

<section class="section">
<div class="head"><h2>Rewards</h2><button class="view" onclick="info('Rewards')">View All</button></div>
<div class="rewards" id="rewards"></div>
</section>

</main>

<div class="bottom">
<button onclick="topPage()"><span>⌂</span>Home</button>
<button onclick="gamesScroll()"><span>🎮</span>Games</button>
<button onclick="info('Rewards')"><span>🎁</span>Rewards</button>
<button onclick="wallet()"><span>💳</span>Wallet</button>
<button onclick="info('Profile')"><span>👤</span>Profile</button>
</div>

<div class="modal" id="modal">
<div class="box" id="box"></div>
</div>

<script>

let balance=Number(localStorage.getItem("balance")||50000);
let timer=null;
let running=false;
let mult=1;
let stake=100;

const games=[
["Aviator","✈️","avi"],
["Dragon Tiger","🐉","simple"],
["Roulette","🎰","simple"],
["Andar Bahar","🃏","simple"],
["Mines","💣","simple"],
["Jackpot Slots","🎰","slots"],
["Crash","🚀","avi"],
["Teen Patti","🃏","simple"],
["Ludo","🎲","simple"],
["Dice","🎲","simple"],
["Plinko","🔴","simple"],
["Lucky Wheel","🎡","wheel"],
["Blackjack","♠️","simple"],
["Baccarat","🃏","simple"],
["Keno","🔢","simple"],
["Coin Flip","🪙","simple"],
["Color Prediction","🎨","simple"],
["Fruit Slots","🍒","slots"],
["Penalty","⚽","simple"],
["Basketball","🏀","simple"],
["Boxing","🥊","simple"],
["Fishing","🎣","simple"],
["Car Race","🏎️","simple"],
["Horse Race","🏇","simple"],
["Tower","🏗️","simple"],
["Hi-Lo","🔼","simple"],
["Red Black","🔴","simple"],
["7 Up 7 Down","7️⃣","simple"],
["Lucky 7","7️⃣","slots"],
["Magic Cards","✨","simple"],
["Dice Duel","🎲","simple"],
["Spin Master","🎡","wheel"],
["Treasure Box","🎁","slots"],
["Gold Rush","🪙","slots"],
["Gem Blast","💎","slots"],
["Rocket","🚀","avi"],
["Sky Run","☁️","avi"],
["Bomb Finder","💣","simple"],
["Safe Box","🔐","simple"],
["Number King","🔢","simple"],
["Lucky Ball","⚽","simple"],
["Color Wheel","🌈","wheel"],
["Mega Slots","🎰","slots"],
["Royal Cards","👑","simple"],
["Fast Dice","🎲","simple"],
["Lucky Draw","🎟️","wheel"],
["Star Spin","⭐","wheel"],
["Diamond Mine","💎","simple"],
["Golden Wheel","🟡","wheel"],
["Super Crash","🚀","avi"]
];

const girls=[
["Ayesha","👩🏻"],["Zoya","👩🏽"],["Hania","👩🏻‍🦰"],
["Laiba","👩🏽‍🦱"],["Sana","👩🏻"],["Maya","👩🏽‍🦱"]
];

const rewards=[
["iPhone 15","📱","1,250,000"],
["Samsung S24","📱","1,150,000"],
["MacBook Air","💻","1,800,000"],
["AirPods Pro","🎧","450,000"],
["Smart Watch","⌚","350,000"],
["Gold Coin","🪙","120,000"]
];

function save(){
localStorage.setItem("balance",balance);
document.getElementById("bal").textContent=balance.toLocaleString();
}

girls.forEach((g,i)=>{
document.getElementById("girls").innerHTML+=`
<div class="card">
<div class="girl">${g[1]}</div>
<h3>${g[0]}</h3>
<div class="coins">🪙 ${(12540-i*600).toLocaleString()}</div>
</div>`;
});

games.forEach(g=>{
document.getElementById("games").innerHTML+=`
<button class="card" onclick="game('${g[0]}')">
<div class="art">${g[1]}</div>
<h3>${g[0]}</h3>
</button>`;
});

rewards.forEach(r=>{
document.getElementById("rewards").innerHTML+=`
<div class="reward">
<div class="art">${r[1]}</div>
<h3>${r[0]}</h3>
<div class="coins">🪙 ${r[2]}</div>
</div>`;
});

save();

function openModal(html){
document.getElementById("box").innerHTML=html;
document.getElementById("modal").classList.add("open");
}

function closeModal(){
document.getElementById("modal").classList.remove("open");
if(timer)clearInterval(timer);
running=false;
}

function info(title){
openModal(`
<button class="close" onclick="closeModal()">✕</button>
<h2>${title}</h2>
<p>GameMaster3D demo section.</p>
<p style="color:#aaa">
This website uses virtual coins only. Real-money deposits,
withdrawals and betting are not connected.
</p>
<button class="btn yellow" onclick="closeModal()">Close</button>
`);
}

function wallet(){
openModal(`
<button class="close" onclick="closeModal()">✕</button>
<h2>💳 Virtual Wallet</h2>
<h3>🪙 ${balance.toLocaleString()} Coins</h3>
<button class="btn green" onclick="addCoins()">+10,000 Demo Coins</button>
<button class="btn yellow" onclick="closeModal()">Close</button>
<p style="color:#aaa">Demo coins only.</p>
`);
}

function addCoins(){
balance+=10000;
save();
closeModal();
}

function bonus(){
let d=new Date().toDateString();

if(localStorage.getItem("daily")==d){
alert("Daily bonus already claimed.");
return;
}

localStorage.setItem("daily",d);
balance+=500;
save();
alert("+500 virtual coins!");
}

function game(name){

let g=games.find(x=>x[0]===name);

if(!g)g=[name,"🎮","simple"];

if(g[2]==="avi"){
aviator(name);
return;
}

if(g[2]==="wheel"){
wheel(name);
return;
}

if(g[2]==="slots"){
slots(name);
return;
}

simple(name,g[1]);
}

function aviator(name){

openModal(`
<button class="close" onclick="closeModal()">✕</button>

<div class="game">
<h2>✈️ ${name}</h2>

<div class="screen">
<div id="multi" class="mult">1.00x</div>
<div id="plane" class="plane">✈️</div>
</div>

<div class="controls">

<div class="control">
<b>Virtual Stake</b>
<input id="stake" type="number" value="100" min="10">
<button class="btn yellow" onclick="startAvi()">START ROUND</button>
</div>

<div class="control">
<b>Round</b>
<div id="aviStatus" class="status">Ready</div>
<button class="btn green" onclick="cashout()">CASH OUT</button>
</div>

</div>

<p class="status">
Playable demo • virtual coins only
</p>
</div>
`);
}

function startAvi(){

if(running)return;

stake=Math.max(10,Number(document.getElementById("stake").value)||100);

if(balance<stake){
alert("Not enough virtual coins.");
return;
}

balance-=stake;
save();

mult=1;
running=true;

document.getElementById("aviStatus").textContent="Flying...";

timer=setInterval(()=>{

mult+=0.02;

document.getElementById("multi").textContent=
mult.toFixed(2)+"x";

document.getElementById("plane").style.left=
Math.min(85,15+mult*8)+"%";

if(mult>=8){

clearInterval(timer);
running=false;

document.getElementById("aviStatus").textContent=
"Round ended at "+mult.toFixed(2)+"x";

}

},80);

}

function cashout(){

if(!running){

alert("Start a round first.");

return;
}

clearInterval(timer);
running=false;

let win=Math.floor(stake*mult);

balance+=win;
save();

document.getElementById("aviStatus").textContent=
"Collected "+win.toLocaleString()+" virtual coins!";
}

function wheel(name){

openModal(`
<button class="close" onclick="closeModal()">✕</button>
<h2>🎡 ${name}</h2>

<div id="wheel" class="wheel"></div>

<div style="text-align:center">
<button class="btn yellow" onclick="spinWheel()">SPIN</button>
<p id="wheelResult" class="status"></p>
</div>
`);
}

function spinWheel(){

let w=document.getElementById("wheel");

w.style.transform=
"rotate("+(1440+Math.random()*360)+"deg)";

setTimeout(()=>{

let n=100+Math.floor(Math.random()*900);

balance+=n;
save();

document.getElementById("wheelResult").textContent=
"🎉 +"+n+" virtual coins";

},2000);
}

function slots(name){

openModal(`
<button class="close" onclick="closeModal()">✕</button>
<h2>🎰 ${name}</h2>

<div id="slot" style="
font-size:55px;
text-align:center;
background:#160b3c;
padding:30px;
border-radius:15px">
🍒 🍋 7️⃣
</div>

<div style="text-align:center">
<button class="btn yellow" onclick="spinSlots()">SPIN</button>
<p id="slotResult" class="status"></p>
</div>
`);
}

function spinSlots(){

let a=["🍒","🍋","🔔","⭐","7️⃣","💎"];

let x=[
a[Math.floor(Math.random()*a.length)],
a[Math.floor(Math.random()*a.length)],
a[Math.floor(Math.random()*a.length)]
];

document.getElementById("slot").textContent=x.join(" ");

let win=0;

if(x[0]===x[1]&&x[1]===x[2])
win=1000;
else if(x[0]===x[1]||x[1]===x[2])
win=200;

if(win){

balance+=win;
save();

document.getElementById("slotResult").textContent=
"🎉 WIN +"+win+" virtual coins";

}else{

document.getElementById("slotResult").textContent=
"Try again!";

}
}

function simple(name,icon){

openModal(`
<button class="close" onclick="closeModal()">✕</button>

<div style="text-align:center;padding:30px">

<div style="font-size:90px">${icon}</div>

<h2>${name}</h2>

<p>Playable virtual-coin mini game.</p>

<button class="btn purple"
onclick="simplePlay('${name}')">
▶ PLAY ROUND
</button>

<p id="simpleResult" class="status"></p>

</div>
`);
}

function simplePlay(name){

let win=50+Math.floor(Math.random()*450);

balance+=win;
save();

document.getElementById("simpleResult").textContent=
"🎉 "+name+" complete — +"+win+" virtual coins";
}

function topPage(){
window.scrollTo({top:0,behavior:"smooth"});
}

function gamesScroll(){
document.getElementById("games").scrollIntoView({behavior:"smooth"});
}

</script>

</body>
</html>
